name: Visual matcher tests

on:
  push:
    branches: [main, feature/openai-vision-fallback]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy Pillow httpx python-dotenv pytest
      - name: Run visual matcher unit tests
        run: python -m pytest -q tests/test_visual_matcher.py
