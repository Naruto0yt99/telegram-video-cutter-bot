name: Bot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Smoke-test imports
        env:
          BOT_TOKEN: ci-placeholder
          OWNER_ID: "1"
          TG_API_ID: "1"
          TG_API_HASH: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
        run: python -c "import bot, find_engine, telegram_remote, gemini_analyzer, telegram_media, database"
